<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — CoolCar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Логотип CoolCar" class="logo-icon">
            <span class="logo-text">CoolCar</span>
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="catalog.html">Каталог</a></li>
                <li><a href="cart.html">Корзина <span id="cart-counter" class="cart-counter"></span></a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
        <div class="header-icons">
            <button class="search-btn" aria-label="Поиск">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <button class="menu-btn" aria-label="Меню">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>

    <main>
        <h1 class="page-title">Каталог аксессуаров</h1>

        <section class="filters">
            <label>Марка
                <select id="filter-brand">
                    <option value="любая">Любая</option>
                    <option value="toyota">Toyota</option>
                    <option value="bmw">BMW</option>
                    <option value="mercedes">Mercedes</option>
                    <option value="lada">Lada</option>
                </select>
            </label>
            <label>Модель
                <select id="filter-model">
                    <option value="любая">Любая</option>
                    <option value="camry">Camry</option>
                    <option value="x5">X5</option>
                    <option value="e-class">E-class</option>
                </select>
            </label>
            <label>Год
                <select id="filter-year">
                    <option value="любой">Любой</option>
                    <option value="2020">2020+</option>
                    <option value="2015">2015–2019</option>
                    <option value="2010">до 2015</option>
                </select>
            </label>
            <label>Поиск
                <input id="search-input" type="text" placeholder="Название товара…">
            </label>
        </section>

        <p id="result-count" class="result-count"></p>

        <section class="cards" id="catalog-cards"></section>
    </main>

    <footer class="main-footer">
        <img src="images/logo.png" alt="CoolCar" class="footer-logo">
        <p class="footer-slogan">CoolCar</p>
        <address>
            <p>+7 (900) 000-00-00</p>
            <p>CoolCar@gmail.com</p>
            <p>ПГТ Бабруйск, ул. Опасная, д.69</p>
        </address>
    </footer>

    <script src="script.js"></script>
</body>
</html>
